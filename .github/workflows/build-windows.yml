name: Build Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64 NSIS installer
    runs-on: windows-2022
    timeout-minutes: 45

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.90.0
          target: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Build NSIS installer
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: albaraa-trade-management-1.1.1-windows-x64-nsis
          path: frontend/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
